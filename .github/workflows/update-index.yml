name: Update index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download index.html from Framer
        run: curl -L "https://waitdiscoverygubbio.framer.ai/" -o index.html

      - name: Clean Framer badge and scripts
        run: |
          sed -i '/__framer-badge-container/d' index.html
          sed -i '/framer\.js/d' index.html
          sed -i '/framer\.css/d' index.html
          sed -i '/__framer__/d' index.html
          sed -i '/data-framer-name/d' index.html

      - name: Check for changes
        run: |
          if git diff --quiet index.html; then
            echo "CHANGES=false" >> $GITHUB_ENV
          else
            echo "CHANGES=true" >> $GITHUB_ENV
          fi

      - name: Commit & push if changes detected
        if: env.CHANGES == 'true'
        run: |
          git config user.name "gablilli"
          git config user.email "167802854+gablilli@users.noreply.github.com"
          git add index.html
          git commit -m "chore: update and clean index.html from remote source"
          git push
